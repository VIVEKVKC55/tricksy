{% extends "layout/layout.html" %}
{% load static %}

{% block title %}{{ customer.full_name }} — Booking Calendar{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="card-title mb-3">
        🗓️ {{ customer.full_name }} — Booking Calendar
      </h4>
      <div id="calendar"></div>
    </div>
  </div>
</div>

<!-- FullCalendar CDN -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const calendarEl = document.getElementById("calendar");

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: "dayGridMonth",
    themeSystem: "bootstrap5",
    height: "auto",
    headerToolbar: {
      left: "prev,next today",
      center: "title",
      right: "dayGridMonth,timeGridWeek,timeGridDay,listWeek"
    },
    nowIndicator: true,
    navLinks: true,
    editable: false,
    events: "{% url 'customer:customer-calendar-data' customer.customer_id %}",

    eventDidMount: function (info) {
      // Tooltip
      const props = info.event.extendedProps;
      const tooltip = `
        <strong>Status:</strong> ${props.status}<br>
        <strong>Address:</strong> ${props.address}<br>
        <strong>Duration:</strong> ${props.duration_hours} hours<br>
        <strong>Region:</strong> ${props.region}
      `;
      new bootstrap.Tooltip(info.el, {
        title: tooltip,
        html: true,
        placement: "top",
        trigger: "hover",
      });
    },
  });

  calendar.render();
});
</script>
{% endblock %}
