{% extends "layout/layout.html" %}

{% block title %}{{ cleaner.name }} Calendar{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="card-title mb-4">
        Schedule for <strong>{{ cleaner.name }}</strong>
      </h4>
      <div id="calendar"></div>
    </div>
  </div>
</div>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const calendarEl = document.getElementById("calendar");
  const dataUrl = "{% url 'cleaner:cleaner-calendar-data' cleaner.id %}";

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: "dayGridMonth",
    height: "auto",
    headerToolbar: {
      left: "prev,next today",
      center: "title",
      right: "dayGridMonth,timeGridWeek,timeGridDay,listWeek",
    },
    events: dataUrl,
    eventTimeFormat: {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false,
    },
    eventDidMount: function (info) {
      const { status, customer, address, region, duration_hours } = info.event.extendedProps;
      const tooltip = `
        <div style='padding:6px'>
          <b>Status:</b> ${status}<br>
          <b>Customer:</b> ${customer}<br>
          <b>Address:</b> ${address}<br>
          <b>Region:</b> ${region}<br>
          <b>Duration:</b> ${duration_hours} hrs
        </div>`;
      new bootstrap.Tooltip(info.el, {
        title: tooltip,
        html: true,
        placement: "top",
        trigger: "hover",
      });
    },
  });

  calendar.render();
});
</script>
{% endblock %}
